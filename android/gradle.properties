org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# ── Build Speed Optimisations ──────────────────────────────────────────────────
# Re-enable the Gradle daemon so the JVM is reused between builds (much faster).
org.gradle.daemon=true
# Parallel project execution (safe for independent modules).
org.gradle.parallel=true
# Build cache — reuses unchanged task outputs across builds.
org.gradle.caching=true
# File-system watching so Gradle detects changes incrementally without full scans.
org.gradle.vfs.watch=true
# Configuration-on-demand: only configure subprojects that are actually needed.
org.gradle.configureondemand=true
