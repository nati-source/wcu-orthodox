name: wcu_orthodox
description: "WCU Gibi Gubae — Official Wachemo University Ethiopian Orthodox Tewahedo Church (EOTC) Student Fellowship Management, Spiritual Family Matching, Pilgrimage & Mutual Aid Platform."
publish_to: 'none'

# Bumped to 1.3.6+10 — versionCode MUST increment on every release for Android
# to allow upgrading over existing installs without "uninstallable" errors.
version: 1.3.6+10

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.4
  fl_chart: ^1.2.0
  url_launcher: ^6.3.2
  intl: ^0.20.3
  shared_preferences: ^2.3.2
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  http: ^1.6.0
  firebase_storage: ^12.4.4
  firebase_messaging: ^15.2.10
  # ─── NFR Additions ─────────────────────────────────────────────────────────
  # Crash reporting — automatically captures uncaught exceptions in production
  firebase_crashlytics: ^4.3.6
  # Usage analytics — screen views, events, retention metrics
  firebase_analytics: ^11.4.5
  # Firestore / network performance traces
  firebase_performance: ^0.10.1+6
  # App Check — blocks unauthorised Firestore/Auth traffic from non-app clients
  firebase_app_check: ^0.3.2+5
  # Connectivity banner — detect and react to network changes gracefully
  connectivity_plus: ^6.1.4
  # Network image caching — avoid re-downloading on every screen visit
  cached_network_image: ^3.4.1
  flutter_local_notifications: ^22.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "asset/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - asset/
    - asset/fonts/

  fonts:
    - family: NotoSansEthiopic
      fonts:
        - asset: asset/fonts/NotoSansEthiopic-Regular.ttf
        - asset: asset/fonts/NotoSansEthiopic-Bold.ttf
          weight: 700
    - family: serif
      fonts:
        - asset: asset/fonts/NotoSansEthiopic-Regular.ttf
        - asset: asset/fonts/NotoSansEthiopic-Bold.ttf
          weight: 700
